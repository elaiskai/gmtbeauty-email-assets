<title>GMT Beauty pop-up preview</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Poppins',Arial,sans-serif; background:#3a352e url('https://images.unsplash.com/photo-1596462502278-27bfdc403348?q=80&w=1400&auto=format&fit=crop') center/cover fixed; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .overlay { position:fixed; inset:0; background:rgba(18,18,18,0.55); }
  .modal { position:relative; z-index:2; width:100%; max-width:440px; background:#ffffff; border-radius:6px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.35); }
  .goldbar { height:4px; background:linear-gradient(90deg,#d2ac67,#efb916,#d2ac67); }
  .close { position:absolute; top:14px; right:16px; z-index:3; font-size:20px; color:#b3a892; text-decoration:none; line-height:1; }
  .pad { padding:38px 40px 34px; text-align:center; }
  .logo { height:44px; width:auto; margin:0 0 22px; }
  .kicker { font-family:'Great Vibes',cursive; font-size:26px; color:#d2ac67; line-height:1; margin:0 0 6px; }
  h1 { font-size:23px; font-weight:600; color:#121212; line-height:1.25; margin:0 0 12px; letter-spacing:0.2px; }
  p.sub { font-size:14px; font-weight:300; line-height:1.55; color:#5a5750; margin:0 0 24px; }
  .offer { display:inline-block; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#a8863f; border:1px dashed #d2ac67; border-radius:3px; padding:8px 16px; margin:0 0 22px; }
  .offer b { color:#121212; letter-spacing:3px; }
  input { width:100%; height:50px; border:1px solid #ddd5c6; border-radius:3px; padding:0 16px; font-family:'Poppins',Arial,sans-serif; font-size:14px; color:#121212; margin:0 0 12px; outline:none; }
  input::placeholder { color:#a49e92; }
  .btn { display:block; width:100%; height:52px; line-height:52px; background:#d2ac67; color:#1a1305; font-size:14px; font-weight:600; letter-spacing:0.5px; border:none; border-radius:3px; cursor:pointer; text-decoration:none; }
  .decline { display:inline-block; margin:16px 0 0; font-size:12px; color:#a49e92; text-decoration:underline; }
  .fine { font-size:10.5px; line-height:1.5; color:#b3ab9c; margin:18px 0 0; }
</style></head>
